<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inbox · Atelier · Flow · brand round 2</title>
<!-- D4b: the Flow Inbox (feel/flow/inbox.html, its <style> copied unchanged) wearing a round-2 mark and a dark-first scheme,
     always in Y1 Sidebar (the owner's pick). Dark is the default theme.
     Query: logo=N1..N11 · scheme=k1..k3, plus every Flow parameter (theme, motion, state, open, demo, shot). -->
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../components.css">
<link rel="stylesheet" href="../../../feel/shared/feel.css">
<link rel="stylesheet" href="../../schemes.css">
<link rel="stylesheet" href="../schemes-k.css">
<link rel="stylesheet" href="../../brand.css">
<link rel="stylesheet" href="../r2.css">
<link rel="stylesheet" href="../../app/layouts.css">
<style>
/* ── FLOW: every item is a thing with a place. ─────────────────────────────────────────────
   An item's title lives in one place at a time: its queue row, the focus, or "Decided today".
   Open an item and its title rises from the row into the focus; decide it and the title flies down
   into Decided today while the next one rises from its row. Undo flies it back. J/K slide the item
   sideways in the direction you moved. Springs (--spring-glide for the long flights and
   big surfaces, --spring-soft for the tick bar, --spring-snappy for rows and presses). Below 1024 px the queue is under the item,
   so nothing flies: the item slides like a card, out to the left, the next in from the right. */

/* Press: the control gives under your finger and springs back. */
.btn, .qitem, .agent, .ledger-row, .choice, .frame { transition: background-color var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-base), transform var(--spring-snappy-dur) var(--spring-snappy); }
.btn:is(:active, .is-active):not(:disabled):not([aria-busy="true"]) { transform: scale(var(--press-scale)); transition-duration: var(--dur-instant); transition-timing-function: var(--ease-press); }
.qitem:active, .ledger-row:active, .agent:active { transform: scale(0.985); transition: transform var(--dur-instant) var(--ease-press); }
/* Hover: frames lift toward you, 2 px, with the dock's shadow. */
.frame:hover .frame-img { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.frame-img { transition: transform var(--spring-snappy-dur) var(--spring-snappy), box-shadow var(--dur-base), border-color var(--dur-fast); }
/* Focus: the ring and halo, as shared. */

/* The decided row and the sent dock: the tick draws in with a spring. */
.qitem.is-done { transition: background-color var(--dur-base) var(--ease-out); }
.dock.is-sent .tick { animation: flow-pop var(--spring-snappy-dur) var(--spring-snappy) both; }
.dock.is-sent .dock-msg > :not(.tick) { animation: flow-in-x var(--dur-slow) var(--ease-enter) 60ms both; }

/* Working now: the bar springs to its new value. */
.agent-progress .track i { transition: transform var(--spring-soft-dur) var(--spring-soft); }
.agent.is-tick .fig { animation: flow-in-y var(--dur-slow) var(--ease-enter); }

/* Toast: rises out of the dock it anchors to. */
.toast { animation: flow-rise var(--spring-snappy-dur) var(--spring-snappy) both; }
.toast.is-leaving { animation: flow-sink var(--dur-base) var(--ease-exit) both; }
.input[aria-invalid="true"] { animation: flow-nudge var(--dur-slow) var(--ease-move); }

/* ── Choreography ── */
/* Titles fly (the one place sizes morph: the group animates its box, the images only move and fade). */
/* Critically damped: a 1.7 % overshoot on an 800 px flight landed the title 10 px into the row below. */
/* It waits --dur-fast: the old body is gone before a title crosses where it was (round 10: at 60 ms the flying title sat on the body). */
::view-transition-group(*.title) { animation-duration: var(--spring-glide-dur); animation-timing-function: var(--spring-glide); animation-delay: var(--dur-fast); z-index: 5; }
/* The snapshots keep their own size, pinned top-left: stretched to the morphing box, the landing title
   read larger and sat over the row below it until the last frame. The old title leaves in --dur-fast and the new one fades in from 160 ms, so the flight is
   faint while it crosses other rows and solid only as it lands. */
::view-transition-old(*.title), ::view-transition-new(*.title) { inline-size: auto; block-size: auto; object-fit: none; object-position: left top; }
::view-transition-old(*.title) { animation: flow-out var(--dur-fast) var(--ease-exit) both; }
::view-transition-new(*.title) { animation: flow-fade var(--dur-slow) var(--ease-enter) 160ms both; }

/* The rest of the item: out the way it's going, in from where it comes. */
::view-transition-group(ih), ::view-transition-group(ib), ::view-transition-group(page), ::view-transition-group(empty), ::view-transition-group(zero-work) { animation: none; }
/* Never a double exposure: the old content is gone (--dur-fast) before the new is more than faint. */
::view-transition-old(ih), ::view-transition-old(ib), ::view-transition-old(page) { animation: flow-leave var(--dur-fast) var(--ease-exit) both; }
::view-transition-new(ih), ::view-transition-new(page) { animation: flow-arrive var(--spring-glide-dur) var(--spring-glide) 100ms both; }
::view-transition-new(ib) { animation: flow-arrive var(--spring-glide-dur) var(--spring-glide) calc(100ms + 2 * var(--stagger)) both; }
html[data-dir="back"]::view-transition-old(ih), html[data-dir="back"]::view-transition-old(ib), html[data-dir="back"]::view-transition-old(page) { animation-name: flow-leave-back; }
html[data-dir="back"]::view-transition-new(ih), html[data-dir="back"]::view-transition-new(ib), html[data-dir="back"]::view-transition-new(page) { animation-name: flow-arrive-back; }
/* Undo: the title leads home; the body unfolds under it once it has nearly landed, so the flight never crosses the frames (round 10). */
html[data-vt="undo"]::view-transition-new(ib) { animation-delay: 380ms; }
/* Deciding: the item is lifted away (down, toward Decided today), not swiped. */
html[data-vt="decide"]::view-transition-old(ih), html[data-vt="decide"]::view-transition-old(ib), html[data-vt="zero"]::view-transition-old(ih), html[data-vt="zero"]::view-transition-old(ib) { animation-name: flow-drop; animation-duration: var(--dur-fast); }

::view-transition-group(dock) { animation: none; }
::view-transition-old(dock) { animation: flow-out var(--dur-fast) var(--ease-exit) both; }
::view-transition-new(dock) { animation: flow-fade var(--dur-base) var(--ease-enter) 80ms both; }

/* Queue rows: they are objects; the gap closes with a spring, new rows grow in. */
/* The leaving row shrinks away in --dur-fast; only then do the rows below spring up into its place (round 10). */
::view-transition-group(*.row) { animation-duration: var(--spring-snappy-dur); animation-timing-function: var(--spring-snappy); animation-delay: var(--dur-fast); }
::view-transition-old(*.row):only-child { animation: flow-shrink var(--dur-fast) var(--ease-exit) both; }
::view-transition-new(*.row):only-child { animation: flow-grow var(--spring-snappy-dur) var(--spring-snappy) 200ms both; }

/* Inbox zero: the last title lands in the ledger, then the calm line rises a long way, slowly. */
::view-transition-new(empty) { animation: flow-rise-far var(--spring-glide-dur) var(--spring-glide) 200ms both; }
::view-transition-new(zero-work) { animation: flow-rise-far var(--spring-glide-dur) var(--spring-glide) calc(200ms + var(--stagger-max)) both; }

/* Phone and tablet: no flights (the queue is below the item), the card slides. */
@media (max-width: 1023px) {
  ::view-transition-new(ih), ::view-transition-new(ib) { animation-name: flow-arrive-card; }
  ::view-transition-old(ih), ::view-transition-old(ib) { animation-name: flow-leave-card; }
  html[data-dir="back"]::view-transition-new(ih), html[data-dir="back"]::view-transition-new(ib) { animation-name: flow-arrive-card-back; }
  html[data-dir="back"]::view-transition-old(ih), html[data-dir="back"]::view-transition-old(ib) { animation-name: flow-leave-card-back; }
}

@keyframes flow-fade { from { opacity: 0; } }
@keyframes flow-out { to { opacity: 0; } }
@keyframes flow-pop { from { opacity: 0; transform: scale(0.4); } }
@keyframes flow-in-x { from { opacity: 0; transform: translateX(calc(-1 * var(--shift))); } }
@keyframes flow-in-y { from { opacity: 0; transform: translateY(var(--shift-sm)); } }
@keyframes flow-rise { from { opacity: 0; transform: translateY(var(--shift-lg)) scale(0.98); } }
@keyframes flow-sink { to { opacity: 0; transform: translateY(var(--shift)); } }
@keyframes flow-nudge { 30% { transform: translateX(calc(-1 * var(--shift-sm))); } 60% { transform: translateX(var(--shift-sm)); } }
@keyframes flow-leave { to { opacity: 0; transform: translateX(calc(-1 * var(--shift-lg))); } }
@keyframes flow-leave-back { to { opacity: 0; transform: translateX(var(--shift-lg)); } }
@keyframes flow-arrive { from { opacity: 0; transform: translateX(var(--shift-lg)); } }
@keyframes flow-arrive-back { from { opacity: 0; transform: translateX(calc(-1 * var(--shift-lg))); } }
@keyframes flow-drop { to { opacity: 0; transform: translateY(var(--shift)) scale(0.985); } }
@keyframes flow-shrink { to { opacity: 0; transform: scale(0.96); } }
@keyframes flow-grow { from { opacity: 0; transform: scale(0.96); } }
@keyframes flow-rise-far { from { opacity: 0; transform: translateY(calc(2 * var(--shift-lg))); } }
@keyframes flow-leave-card { to { opacity: 0; transform: translateX(-40%); } }
@keyframes flow-leave-card-back { to { opacity: 0; transform: translateX(40%); } }
@keyframes flow-arrive-card { from { opacity: 0; transform: translateX(40%); } }
@keyframes flow-arrive-card-back { from { opacity: 0; transform: translateX(-40%); } }
</style>
</head>
<body>
<a class="btn btn-primary skip" href="#ttl">Skip to the decision</a>
<div class="shell" id="shell">
  <aside class="sidebar shell-side" id="side" aria-label="Atelier"></aside>
  <header class="topbar shell-top" id="top"></header>
  <main class="shell-main" id="main"></main>
  <nav class="tabbar shell-tabs" id="tabs" aria-label="Main"></nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="mock" id="mock"></div>
<script>window.FEEL = { name: 'flow', morph: true };</script>
<script src="../marks.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), d = document.documentElement;
  /* Dark first: with no theme in the query the page is dark, whatever the system says. */
  if (!q.get('theme')) { q.set('theme', 'dark'); history.replaceState(null, '', `${location.pathname}?${q}${location.hash}`); }
  const logo = MARKS.some(m => m.id === q.get('logo')) ? q.get('logo') : 'N1';
  d.dataset.scheme = /^k[1-3]$/.test(q.get('scheme')) ? q.get('scheme') : 'k1';
  d.dataset.layout = 'y1';
  window.BRAND_HTML = lockup2(logo, 20);
  window.IMG_BASE = '../../../screens/img/';
})();
</script>
<script src="../../../icons.js"></script>
<script src="../../../feel/shared/inbox.js"></script>
</body>
</html>
