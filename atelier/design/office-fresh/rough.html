<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office fresh · rough layouts</title>
<!-- Rough layouts (R-1 step 2): structure and balance only, greyboxes on the real data shapes.
     ?f=o1a|o1b|o2a|o2b|o3a|o3b. A box marked "scene" is where the picture goes; its size is the point. -->
<style>
  :root { color-scheme: dark; --bg: #0b0e13; --s: #141922; --s2: #1b212b; --b: #2a3240; --t: #e7ebf2; --t2: #9aa4b4; --a: #b39cff; --n: #ff8578; --d: #5fd198; font: 13px/18px "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t); }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .side { background: #0e1218; border-right: 1px solid var(--b); padding: 16px; color: var(--t2); }
  .side b { display: block; height: 14px; margin: 10px 0; background: var(--s2); border-radius: 3px; }
  main { padding: 24px 32px 64px; display: grid; gap: 28px; align-content: start; max-width: 1240px; }
  .head { display: flex; gap: 12px; align-items: baseline; border-bottom: 1px solid var(--b); padding-bottom: 14px; }
  .head h1 { font-size: 15px; margin: 0; }
  .tag { position: fixed; right: 12px; top: 8px; font: 11px monospace; color: var(--t2); border: 1px dashed var(--b); padding: 2px 6px; }
  .floor { display: grid; gap: 12px; }
  .fh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .fh h2 { margin: 0; font-size: 18px; }
  .fh span { color: var(--t2); }
  .sc { background: repeating-linear-gradient(135deg, #161c26 0 6px, #131821 6px 12px); border: 1px solid var(--b); border-radius: 6px; display: grid; place-items: center; color: #5d6779; font-size: 11px; position: relative; overflow: hidden; }
  .sc[data-k="active"] { box-shadow: inset 0 -3px 0 var(--a); color: var(--a); }
  .sc[data-k="needs"] { box-shadow: inset 0 -3px 0 var(--n); color: var(--n); }
  .sc[data-k="off"] { opacity: .45; }
  .w { font-size: 12px; color: var(--t2); }
  .w b { color: var(--t); font-weight: 600; }
  .line { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; padding: 8px 0; border-top: 1px solid var(--b); }
  .ln-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rest { color: var(--t2); padding-top: 8px; border-top: 1px solid var(--b); }
  .tabs { display: none; }
  /* O1a: one room strip, all desks in one row; news lines under it */
  .o1a .room { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(84px, 1fr); gap: 0; border-radius: 8px; overflow: auto; }
  .o1a .room .sc { height: 132px; border-radius: 0; border-left: 0; }
  /* O1b: bays wrap; news column on the right at desktop */
  .o1b .fb { display: grid; grid-template-columns: 1fr 360px; gap: 16px; }
  .o1b .room { display: grid; grid-template-columns: repeat(6, 1fr); }
  .o1b .room .sc { height: 120px; border-radius: 0; }
  /* O2a: bento module, working and needs span two */
  .o2a .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 172px; gap: 10px; grid-auto-flow: dense; }
  .o2a .t { display: grid; grid-template-rows: 1fr auto; gap: 6px; background: var(--s); border: 1px solid var(--b); border-radius: 10px; padding: 8px; }
  .o2a .t.big { grid-column: span 2; grid-template-columns: 150px 1fr; grid-template-rows: 1fr; }
  /* O2b: big at-work tiles, then a shelf of small standby tiles */
  .o2b .work { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .o2b .work .t { display: grid; grid-template-columns: 160px 1fr; gap: 12px; background: var(--s); border: 1px solid var(--b); border-radius: 10px; padding: 8px; height: 150px; }
  .o2b .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .o2b .shelf .t { display: grid; gap: 4px; }
  .o2b .shelf .sc { height: 80px; }
  /* O3a: rows with a portrait vignette; idle on a bench */
  .o3a .rows .r { display: grid; grid-template-columns: 64px 140px 1fr 160px; gap: 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--b); }
  .o3a .rows .sc { height: 56px; }
  .o3a .bench { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; padding-top: 10px; border-top: 1px solid var(--b); }
  .o3a .bench .sc { height: 60px; }
  .o3a .bench .w { text-align: center; }
  /* O3b: every agent a row, idle rows compact */
  .o3b .rows .r { display: grid; grid-template-columns: 44px 130px 1fr 220px 90px; gap: 12px; align-items: center; height: 52px; border-top: 1px solid var(--b); }
  .o3b .rows .r.idle { height: 36px; }
  .o3b .rows .r.idle .sc { height: 28px; }
  .o3b .rows .sc { height: 40px; }
  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    main { padding: 16px 16px 96px; gap: 24px; }
    .tabs { display: block; position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: #0e1218; border-top: 1px solid var(--b); }
    .o1a .room { grid-auto-columns: 88px; }
    .o1b .fb { grid-template-columns: 1fr; }
    .o1b .room { grid-template-columns: repeat(4, 1fr); }
    .o1b .room .sc { height: 96px; }
    .line { grid-template-columns: 84px 1fr; }
    .line .w:last-child { grid-column: 2; }
    .o2a .grid { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 118px; gap: 8px; }
    .o2a .t.big { grid-column: span 3; grid-template-columns: 112px 1fr; }
    .o2b .work { grid-template-columns: 1fr; }
    .o2b .work .t { grid-template-columns: 112px 1fr; height: 128px; }
    .o2b .shelf { grid-template-columns: repeat(4, 1fr); }
    .o2b .shelf .sc { height: 64px; }
    .o3a .rows .r { grid-template-columns: 56px 1fr; }
    .o3a .rows .r > :nth-child(n+3) { grid-column: 2; }
    .o3a .bench { grid-template-columns: repeat(5, 1fr); }
    .o3a .bench .sc { height: 52px; }
    .o3b .rows .r { grid-template-columns: 40px 1fr 70px; }
    .o3b .rows .r > :nth-child(3), .o3b .rows .r > :nth-child(4) { display: none; }
    .o3b .rows .r.idle { grid-template-columns: 40px 1fr 70px; }
  }
</style>
</head>
<body>
<div class="app"><aside class="side">sidebar<b></b><b></b><b></b><b></b></aside><main id="m"></main></div>
<nav class="tabs"></nav>
<script src="data.js"></script>
<script>
  const { FLOORS, meta, news } = window.OF_DATA;
  const f = new URLSearchParams(location.search).get('f') || 'o1a';
  document.body.className = f;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sc = (d, txt = 'scene') => `<div class="sc" data-k="${d.k}">${txt}</div>`;
  const w = d => `<div class="w"><b>${esc(d.role)}</b> · ${esc(d.word)}</div>`;
  const line = d => `<div class="line"><div class="w"><b>${esc(d.role)}</b><br>${esc(d.word)}</div><div class="ln-t">${esc(d.what)} — <span class="w">${esc(d.step)}</span></div><div class="w">${esc(meta(d))}</div></div>`;
  const rest = fl => { const r = fl.desks.filter(d => !news(d)); return r.length ? `<div class="rest">${r.length === fl.desks.length ? 'Everyone' : r.length} ${fl.off ? 'off · lead off, nothing running' : 'at rest'}: ${r.map(d => d.role).join(', ')}</div>` : ''; };
  const L = {
    o1a: fl => `<div class="room">${fl.desks.map(d => sc(d, d.role)).join('')}</div>${fl.desks.filter(news).map(line).join('')}${rest(fl)}`,
    o1b: fl => `<div class="fb"><div class="room">${fl.desks.map(d => sc(d, d.role)).join('')}</div><div>${fl.desks.filter(news).map(line).join('') || '<div class="w">Nothing going on</div>'}${rest(fl)}</div></div>`,
    o2a: fl => `<div class="grid">${fl.desks.map(d => news(d) ? `<div class="t big">${sc(d)}<div>${w(d)}<div>${esc(d.what)}</div><div class="w">${esc(d.step)}</div><div class="w">${esc(meta(d))}</div></div></div>` : `<div class="t">${sc(d)}${w(d)}</div>`).join('')}</div>`,
    o2b: fl => `${fl.desks.some(news) ? `<div class="work">${fl.desks.filter(news).map(d => `<div class="t">${sc(d)}<div>${w(d)}<div>${esc(d.what)}</div><div class="w">${esc(d.step)}</div><div class="w">${esc(meta(d))}</div></div></div>`).join('')}</div>` : ''}<div class="shelf">${fl.desks.filter(d => !news(d)).map(d => `<div class="t">${sc(d, '')}${w(d)}</div>`).join('')}</div>`,
    o3a: fl => `<div class="rows">${fl.desks.filter(news).map(d => `<div class="r">${sc(d, '')}${w(d)}<div>${esc(d.what)}<div class="w">${esc(d.step)}</div></div><div class="w">${esc(meta(d))}</div></div>`).join('')}</div><div class="bench">${fl.desks.filter(d => !news(d)).map(d => `<div>${sc(d, '')}<div class="w">${esc(d.role)}</div></div>`).join('')}</div>`,
    o3b: fl => `<div class="rows">${fl.desks.map(d => `<div class="r${news(d) ? '' : ' idle'}">${sc(d, '')}${w(d)}<div class="ln-t">${esc(d.what)}</div><div class="w ln-t">${esc(d.step)}</div><div class="w">${esc(meta(d))}</div></div>`).join('')}</div>`,
  };
  document.getElementById('m').innerHTML = `<div class="head"><h1>Office</h1><span class="w">2 working · 1 needs you · 2 on duty</span></div>` +
    FLOORS.map(fl => `<section class="floor"><div class="fh"><h2>${fl.p}</h2><span>${fl.off ? 'Lead off · nothing running' : `${fl.working} working${fl.needs ? ` · ${fl.needs} needs you` : ''}`} · ${fl.today} today</span></div>${L[f](fl)}</section>`).join('') +
    `<span class="tag">ROUGH ${f.toUpperCase()}</span>`;
</script>
</body>
</html>
