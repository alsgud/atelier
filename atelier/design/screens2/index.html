<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>High-fi screens (D6, provisional) · Atelier</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="hf.css">
<style>
  .ix { max-width: 1120px; margin: 0 auto; padding: var(--space-10) var(--space-8) var(--space-16); display: grid; gap: var(--space-10); }
  .ix header { display: grid; gap: var(--space-3); }
  .ix h1 { font-family: var(--font-display); font-weight: var(--weight-regular); font-size: var(--text-2xl); line-height: var(--leading-2xl); letter-spacing: var(--tracking-display); margin: 0; }
  .ix h2 { font-size: var(--text-lg); line-height: var(--leading-lg); margin: 0; font-weight: var(--weight-semibold); }
  .ix p { margin: 0; color: var(--text-2); font-size: var(--text-md); line-height: var(--leading-md); max-width: var(--measure); }
  .prov { border: var(--border-width) dashed color-mix(in srgb, var(--brand-accent) 55%, transparent); border-radius: var(--radius-md); padding: var(--space-4) var(--space-5); display: grid; gap: var(--space-3); }
  .prov b.tag { font: var(--weight-semibold) var(--text-xs)/var(--leading-xs) var(--font-mono); letter-spacing: .06em; color: var(--brand-accent); }
  .prov ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-1); font-size: var(--text-sm); line-height: var(--leading-sm); color: var(--text-2); }
  .prov li b { color: var(--text); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; display: inline-block; min-width: 4.6em; }
  .prov li span { color: var(--text-3); }
  .cards { display: grid; gap: var(--space-6); }
  .card { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: var(--space-5); padding: var(--space-5); border: var(--border-width) solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
  .card .shots { display: contents; }
  .card img { width: 100%; border-radius: var(--radius-sm); border: var(--border-width) solid var(--border); display: block; background: var(--surface-sunken); }
  .card .wide { grid-column: 1; }
  .card .info { grid-column: 1 / -1; display: grid; gap: var(--space-2); }
  .card .info h3 { margin: 0; font-size: var(--text-md); display: flex; gap: var(--space-2); align-items: baseline; flex-wrap: wrap; }
  .card .info h3 small { color: var(--text-3); font-weight: var(--weight-regular); font-size: var(--text-sm); }
  .card .info p { font-size: var(--text-sm); line-height: var(--leading-sm); }
  .card.is-todo { opacity: .75; grid-template-columns: 1fr; }
  .grid-links { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); font-size: var(--text-sm); color: var(--text-3); align-items: center; }
  .grid-links a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; display: inline-flex; align-items: center; min-height: 28px; }
  .grid-links a:hover { text-decoration-color: currentColor; }
  .demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-5); }
  .demo { display: grid; gap: var(--space-2); font-size: var(--text-sm); color: var(--text-2); }
  .demo video { width: 100%; border-radius: var(--radius-md); border: var(--border-width) solid var(--border); background: #000; }
  .demo video.is-phone { max-height: 520px; width: auto; justify-self: start; }
  @media (max-width: 767px) {
    .ix { padding: var(--space-6) var(--space-4) var(--space-12); gap: var(--space-8); }
    .ix h1 { font-size: var(--text-xl); line-height: var(--leading-xl); }
    .card { grid-template-columns: minmax(0, 1fr) 96px; padding: var(--space-4); gap: var(--space-3); }
    .grid-links a { min-height: 44px; }
  }
</style>
</head>
<body>
<main class="ix" id="ix"></main>
<script src="../icons.js"></script>
<script src="../brand/r2/marks.js"></script>
<script src="../ux/wf/wf.js"></script>
<script>
(() => {
  const M = window.ATELIER_MODEL;
  /* Every screen of the D6 task, in build order (core first). ready = drawn high-fi; ux = the decisions it is drawn on. */
  const SCREENS = [
    { id: 'office', name: 'Office', ready: true, ux: ['UX-8', 'UX-9', 'UX-7', 'UX-2'], what: 'A floor per project, a desk per agent: a lit window while it works, a raised hand when it needs you. Live changes in place.', states: ',loading,empty,error,stale' },
    { id: 'project', name: 'Project page', ready: true, ux: ['UX-6', 'UX-14', 'UX-3', 'UX-11'], what: 'Now first: one sentence on what is going on and its button, the phase track with its outcomes, the figures in one line. Then what needs you here, what is in progress, recent events; money, plan and team beside it. Live refresh in place.', states: ',loading,error,stale',
      also: [['dodge, lead off', 'project.html?p=dodge'], ['tidepool, created a minute ago (empty)', 'project.html?p=tidepool'], ['Lead menu', 'project.html?ui=menu'], ['Stop the lead: confirm', 'project.html?ui=stop'], ['Tasks', 'project.html?tab=tasks'], ['Outcomes', 'project.html?tab=outcomes'], ['Audits', 'project.html?tab=audits'], ['Docs', 'project.html?tab=docs']] },
    { id: 'task', name: 'Task page', ready: true, ux: ['UX-4', 'UX-5', 'UX-10'], what: 'The latest step as the headline, why and what next under it, last active (or the quiet signal), the stage track filling to its progress. Then the proof large (screenshots, the recording with its length, the run log), latest steps, review, and history and notes folded; status, tries, spend, outcomes and the work beside it. A dock only when it needs you.', states: ',loading,error,stale',
      also: [['Auditor: quiet longer than usual, no proof yet', 'task.html?t=audit'], ['Designer', 'task.html?t=draw'], ['It asked you a question (dock)', 'task.html?v=needs'], ['Waits for your OK on its plan (dock)', 'task.html?v=plan'], ['Done: review passed', 'task.html?v=done'], ['Proof viewer', 'task.html?ui=proof'], ['Stop: confirm', 'task.html?ui=stop'], ['Answer sent, toast up', 'task.html?v=needs&ui=toast']] },
    { id: 'inbox', name: 'Inbox', ux: ['UX-1', 'UX-10'], what: 'The D2 Inbox in N1 + K1 dark, every behaviour kept: decide, Undo in the toast, zero.' },
    { id: 'projects', name: 'Projects', ux: ['UX-14'], what: 'One sentence per project.' },
    { id: 'activity', name: 'Activity', ux: ['UX-13'], what: 'One feed by day; a project picker and Only problems.' },
    { id: 'new', name: 'New project', ux: ['UX-12'], what: 'The same create field, growing into a brief.' },
    { id: 'settings', name: 'Settings', ux: ['UX-3'], what: 'Global settings; each project keeps its own Settings tab.' },
  ];
  const used = k => SCREENS.filter(s => s.ux.includes(k)).map(s => s.name).join(', ');
  const views = s => ['1440', '768', '390'].map(w => ['dark', 'light'].map(t => `<a href="frame.html?src=${s.id}.html&w=${w}&theme=${t}${s.states ? '&states=' + s.states : ''}">${w} ${t}</a>`).join('')).join('');
  const DEMOS = [
    ['office-desktop-dark', 'Office as agents start and finish · desktop'],
    ['office-phone-dark', 'Office as agents start and finish · phone', true],
    ['project-desktop-dark', 'A project page while a task finishes (live refresh, R7) · desktop'],
    ['project-phone-dark', 'A project page while a task finishes · phone', true],
    ['task-desktop-dark', 'Open a task from the Office and read its proof · desktop'],
    ['task-phone-dark', 'Open a task from the Office and read its proof · phone', true],
  ];
  document.getElementById('ix').innerHTML = `
    <header>
      <span class="lockup">${window.mark2('N1', 24)}<span class="wm">Atelier</span></span>
      <h1>Every screen, high-fi</h1>
      <p>N1 + K1 North light, dark first, Y1 sidebar, Flow motion. Each screen at 1440, 768 and 390, dark and light, with its loading, empty, error and stale states. Real content: the same figures on every screen (7 waiting, 2 need you, 3 working, $52.60 today, plan 41 %).</p>
    </header>
    <section class="prov" aria-labelledby="prov-h">
      <b class="tag" id="prov-h">PROVISIONAL</b>
      <p>You haven’t answered the fifteen UX questions yet, so these screens are drawn on my recommended answers. Each line says which screens use it. If you answer one differently, only those parts change: the data model in <code>ux/wf/wf.js</code> is the one place a pick lives, and DESIGN.md › Screens (D6) lists what reworks for each answer.</p>
      <ul>${Object.entries(M.UX).map(([k, [v, t]]) => `<li><b>${k} ${v}</b>${t}${used(k) ? ` <span>· ${used(k)}</span>` : ''}</li>`).join('')}</ul>
    </section>
    <section class="cards" aria-labelledby="sc-h">
      <h2 id="sc-h">Screens</h2>
      ${SCREENS.map(s => s.ready ? `
      <article class="card">
        <a class="wide" href="${s.id}.html"><img src="img/${s.id}-1440-dark.png" alt="${s.name} at 1440, dark" loading="lazy"></a>
        <a href="${s.id}.html"><img src="img/${s.id}-390-darkv.png" alt="${s.name} on a phone, dark" loading="lazy"></a>
        <div class="info">
          <h3><a class="link" href="${s.id}.html">${s.name}</a><small>${s.ux.map(k => `${k} ${M.UX[k][0]}`).join(' · ')}</small></h3>
          <p>${s.what}</p>
          <div class="grid-links">Open at ${views(s)}</div>
          ${s.also ? `<div class="grid-links">Also ${s.also.map(([t, u]) => `<a href="frame.html?src=${encodeURIComponent(u)}${s.states ? '&states=' + s.states : ''}">${t}</a>`).join('')}</div>` : ''}
        </div>
      </article>` : `
      <article class="card is-todo"><div class="info"><h3>${s.name}<small>coming in this task · ${s.ux.map(k => `${k} ${M.UX[k][0]}`).join(' · ')}</small></h3><p>${s.what} Wireframe: <a class="link" href="../ux/wf/${s.id}.html">ux/wf/${s.id}.html</a></p></div></article>`).join('')}
    </section>
    <section class="cards" aria-labelledby="dm-h">
      <h2 id="dm-h">Demos</h2>
      <div class="demos">${DEMOS.map(([f, t, ph]) => `<figure class="demo" style="margin:0"><video class="${ph ? 'is-phone' : ''}" src="media/${f}.webm#t=0.8" controls muted loop playsinline preload="auto"></video><figcaption>${t} · <a class="link" href="media/contact-${f}.png">contact sheet</a></figcaption></figure>`).join('')}</div>
    </section>`;
})();
</script>
</body>
</html>
